; Mobile quality tiers (S24 Ultra = Adreno 750, S25 = Adreno 830: both map to Android_Epic).
; Lighting is baked (Cycles) so every tier gets the same light. Mobile deferred shading + temporal AA (no MSAA:
; TAA also removes texture/specular shimmer). All tiers are capped at 30 fps; the top tiers spend the headroom on resolution.
; Vulkan is enabled on all tiers that support it, OpenGL ES 3.1 is the fallback.
