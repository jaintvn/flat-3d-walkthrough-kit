; Android uses the baked-lighting variant of the level (the Mac build keeps Lumen on L_FlatTypeG).
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Flat/Maps/L_FlatTypeG_Mobile.L_FlatTypeG_Mobile

; 30 fps cap on all Android devices. Device-profile t.MaxFPS alone is overridden at startup by the game user settings
; (FrameRateLimit=0), so the cap is set here and paced by the swap chain: SyncInterval is relative to 60 Hz on Android.
[SystemSettings]
rhi.SyncInterval=2
t.MaxFPS=30
